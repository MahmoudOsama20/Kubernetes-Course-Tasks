
apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-deployment
  namespace: webapp

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      # Allow containers to share the process namespace
      shareProcessNamespace: true

      # Init Container
      initContainers:
        - name: init-done
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo done

      # Application Containers
      containers:

        # Main Container: Nginx
        - name: nginx
          image: nginx:1.27

          ports:
            - containerPort: 80

          command:
            - /bin/sh
            - -c
            - |
              echo "<h1>hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')</h1>" \
                > /usr/share/nginx/html/index.html

              nginx -g 'daemon off;'

        # Sidecar Container: Time Updater
        - name: time-updater
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              while true; do
                PID=$(pgrep -o nginx)

                if [ -n "$PID" ]; then
                  echo "<h1>hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')</h1>" \
                    > /proc/$PID/root/usr/share/nginx/html/index.html
                fi

                sleep 5
              done

          securityContext:
            capabilities:
              add:
                - SYS_PTRACE
