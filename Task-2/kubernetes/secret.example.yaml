# Copy this file to secret.yaml (gitignored) and replace placeholder values before applying,
# or create the secret imperatively via `kubectl create secret generic mysql-secret ...`.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: webapp-stack
type: Opaque
stringData:
  root-password: "CHANGE_ME_ROOT_PASSWORD"
  app-user: "CHANGE_ME_APP_USER"
  app-password: "CHANGE_ME_APP_PASSWORD"
